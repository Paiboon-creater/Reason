<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สาเหตุที่ไม่ได้ยอด</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* ธีมกระดานหุ้น โทนสีฟ้าเขียว (Cyan/Teal Stock Board Theme) */
        body {
            background-color: #0b1519;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
        }
        .container {
            max-width: 600px;
            margin-top: 2rem;
            margin-bottom: 2rem;
        }
        .stock-header {
            color: #00e5ff;
            text-align: center;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.6);
            margin-bottom: 20px;
            font-weight: bold;
        }
        .card-stock {
            background-color: #112228;
            border: 1px solid #1a3c45;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.8);
        }
        .form-control-stock {
            background-color: #050a0c;
            border: 1px solid #1a3c45;
            color: #00e5ff;
            font-size: 1.1rem;
        }
        .form-control-stock:focus {
            background-color: #050a0c;
            color: #00e5ff;
            border-color: #00e5ff;
            box-shadow: 0 0 8px rgba(0, 229, 255, 0.5);
        }
        .btn-buy {
            background-color: #009688;
            color: white;
            border: 1px solid rgba(0, 229, 255, 0.2);
            font-weight: bold;
        }
        .btn-buy:hover { background-color: #00bfa5; color: white; }
        .btn-sell { background-color: #d93838; color: white; font-weight: bold;}
        .btn-sell:hover { background-color: #ff5252; color: white; }
        .btn-edit { background-color: #e6a817; color: white; font-weight: bold;}
        
        .table-stock { color: #c9d1d9; border-color: #1a3c45; margin-top: 20px;}
        .table-stock th {
            background-color: #112228;
            color: #00e5ff;
            border-bottom: 2px solid #00e5ff;
        }
        .table-stock td { vertical-align: middle; }
        .table-stock tbody tr:hover { background-color: #162f38; }
        
        .toggle-btn {
            background-color: #1a3c45;
            color: #00e5ff;
            font-weight: bold;
            border-radius: 5px;
            border: 1px solid #00e5ff;
        }
        .toggle-btn:hover { background-color: #00e5ff; color: #0b1519; }
        
        .action-btns button { padding: 5px 10px; font-size: 0.85rem; margin-bottom: 3px; }
        
        .reason-cell {
            color: #003344;
            font-weight: bold;
            background-color: #b2ebf2;
            border-radius: 4px;
            padding: 6px 10px !important;
            display: inline-block;
            width: 100%;
            text-align: left;
            word-break: break-word;
        }
    </style>
</head>
<body>

<div class="container">
    <h4 class="stock-header">★ บันทึกสาเหตุที่ไม่ได้ยอด ★</h4>
    
    <!-- ฟอร์มเพิ่มข้อมูล -->
    <div class="card card-stock p-4 mb-4">
        <label class="form-label" style="color: #79aebf;">ระบุสาเหตุ (Reason Detail)</label>
        <input type="text" id="reasonInput" class="form-control form-control-stock mb-3" placeholder="พิมพ์สาเหตุที่นี่...">
        <button class="btn btn-buy w-100 py-2" id="btnAdd" onclick="addReason()">[+] บันทึกข้อมูล (SAVE)</button>
    </div>

    <!-- ปุ่มเปิดปิดตาราง -->
    <button class="btn toggle-btn w-100 py-2 mb-3" onclick="toggleTable()">
        เปิด/ปิด กระดานตรวจสอบข้อมูล ▼
    </button>

    <!-- พื้นที่แสดงตาราง (ซ่อนไว้ตอนแรก) -->
    <div id="tableContainer" style="display: none;">
        <div class="table-responsive">
            <table class="table table-stock text-center align-middle">
                <thead>
                    <tr>
                        <th style="width: 20%;">ID</th>
                        <th class="text-start" style="width: 50%;">REASON</th>
                        <th style="width: 30%;">ACTION</th>
                    </tr>
                </thead>
                <tbody id="reasonTableBody">
                    <!-- ข้อมูลจะแสดงตรงนี้ -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://siiiifesdjuunwmwozfb.supabase.co/rest/v1/reasons';
    const SUPABASE_KEY = 'sb_publishable_ohToE8Z_Fzo87uBtzdPDIg_cqHCi3HT';

    const headers = {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation'
    };

    let isTableVisible = false;

    function toggleTable() {
        const container = document.getElementById('tableContainer');
        isTableVisible = !isTableVisible;
        
        if (isTableVisible) {
            container.style.display = 'block';
            loadData();
        } else {
            container.style.display = 'none';
        }
    }

    async function checkDuplicateReason(reasonToCheck, excludeId = null) {
        try {
            const encodedReason = encodeURIComponent(reasonToCheck);
            let url = `${SUPABASE_URL}?reason_detail=eq.${encodedReason}&select=id_reason,reason_detail`;
            
            if (excludeId) {
                url += `&id_reason=neq.${excludeId}`;
            }

            const response = await fetch(url, { method: 'GET', headers: headers });
            const data = await response.json();
            return data.length > 0;
        } catch (error) {
            console.error('Check duplicate error:', error);
            return false;
        }
    }

    async function loadData() {
        if (!isTableVisible) return;
        
        const tbody = document.getElementById('reasonTableBody');
        tbody.innerHTML = '<tr><td colspan="3" class="text-center text-warning">กำลังโหลดข้อมูล...</td></tr>';
        
        try {
            const response = await fetch(`${SUPABASE_URL}?select=*&order=reason_detail.asc`, { method: 'GET', headers: headers });
            const data = await response.json();
            
            tbody.innerHTML = '';
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="text-center" style="color: #79aebf;">ยังไม่มีข้อมูลสาเหตุ</td></tr>';
                return;
            }

            data.forEach(item => {
                const tr = document.createElement('tr');
                
                const tdId = document.createElement('td');
                tdId.style.color = '#79aebf';
                tdId.style.fontSize = '0.9rem';
                tdId.textContent = item.id_reason;

                const tdReason = document.createElement('td');
                tdReason.className = 'text-start';
                const divReason = document.createElement('div');
                divReason.className = 'reason-cell';
                divReason.textContent = item.reason_detail;
                tdReason.appendChild(divReason);

                const tdAction = document.createElement('td');
                tdAction.className = 'action-btns';

                const btnEdit = document.createElement('button');
                btnEdit.className = 'btn btn-edit w-100';
                btnEdit.textContent = 'Edit';
                btnEdit.onclick = () => editReason(item.id_reason, item.reason_detail);

                const btnDel = document.createElement('button');
                btnDel.className = 'btn btn-sell w-100 mt-1';
                btnDel.textContent = 'Del';
                btnDel.onclick = () => deleteReason(item.id_reason);

                tdAction.appendChild(btnEdit);
                tdAction.appendChild(btnDel);

                tr.appendChild(tdId);
                tr.appendChild(tdReason);
                tr.appendChild(tdAction);

                tbody.appendChild(tr);
            });
        } catch (error) {
            console.error('Error loading data:', error);
            tbody.innerHTML = '<tr><td colspan="3" class="text-center text-danger">เกิดข้อผิดพลาดในการโหลดข้อมูล</td></tr>';
        }
    }

    async function addReason() {
        const reasonInput = document.getElementById('reasonInput');
        const reasonVal = reasonInput.value.trim();
        const btnAdd = document.getElementById('btnAdd');
        
        if (!reasonVal) {
            Swal.fire({ icon: 'warning', title: 'กรุณาระบุสาเหตุ', background: '#112228', color: '#c9d1d9'});
            return;
        }

        btnAdd.disabled = true;
        btnAdd.innerText = 'กำลังตรวจสอบ...';
        
        const isDuplicate = await checkDuplicateReason(reasonVal);
        if (isDuplicate) {
            Swal.fire({ icon: 'error', title: 'ข้อมูลซ้ำ!', text: 'มีสาเหตุนี้ในระบบแล้ว ไม่สามารถบันทึกซ้ำได้', background: '#112228', color: '#c9d1d9' });
            btnAdd.disabled = false;
            btnAdd.innerText = '[+] บันทึกข้อมูล (SAVE)';
            return;
        }

        try {
            const response = await fetch(SUPABASE_URL, {
                method: 'POST',
                headers: headers,
                body: JSON.stringify({ reason_detail: reasonVal })
            });

            if (response.ok) {
                Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ', timer: 1500, showConfirmButton: false, background: '#112228', color: '#00e5ff' });
                reasonInput.value = '';
                loadData();
            } else {
                throw new Error('Insert failed');
            }
        } catch (error) {
            Swal.fire({ icon: 'error', title: 'ไม่สามารถบันทึกข้อมูลได้', background: '#112228', color: '#c9d1d9' });
        } finally {
            btnAdd.disabled = false;
            btnAdd.innerText = '[+] บันทึกข้อมูล (SAVE)';
        }
    }

    async function editReason(id, currentReason) {
        const { value: newReason } = await Swal.fire({
            title: 'แก้ไขสาเหตุ',
            input: 'text',
            inputValue: currentReason,
            showCancelButton: true,
            background: '#112228',
            color: '#c9d1d9',
            confirmButtonColor: '#009688',
            confirmButtonText: 'บันทึก',
            cancelButtonText: 'ยกเลิก'
        });

        if (newReason && newReason.trim() !== currentReason) {
            const finalReason = newReason.trim();
            
            const isDuplicate = await checkDuplicateReason(finalReason, id);
            if (isDuplicate) {
                Swal.fire({ icon: 'error', title: 'ข้อมูลซ้ำ!', text: 'มีสาเหตุนี้ในระบบแล้ว', background: '#112228', color: '#c9d1d9' });
                return;
            }

            try {
                const response = await fetch(`${SUPABASE_URL}?id_reason=eq.${id}`, {
                    method: 'PATCH',
                    headers: headers,
                    body: JSON.stringify({ reason_detail: finalReason })
                });
                
                if (response.ok) {
                    Swal.fire({ icon: 'success', title: 'อัปเดตข้อมูลสำเร็จ', timer: 1500, showConfirmButton: false, background: '#112228', color: '#00e5ff' });
                    loadData();
                }
            } catch (error) {
                Swal.fire({ icon: 'error', title: 'อัปเดตไม่สำเร็จ', background: '#112228', color: '#c9d1d9' });
            }
        }
    }

    async function deleteReason(id) {
        const confirm = await Swal.fire({
            title: 'ยืนยันการลบข้อมูล?',
            text: `ลบสาเหตุรหัส: ${id}`,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d93838',
            cancelButtonColor: '#6c757d',
            background: '#112228',
            color: '#c9d1d9',
            confirmButtonText: 'ใช่, ลบเลย!',
            cancelButtonText: 'ยกเลิก'
        });

        if (confirm.isConfirmed) {
            try {
                const response = await fetch(`${SUPABASE_URL}?id_reason=eq.${id}`, {
                    method: 'DELETE',
                    headers: headers
                });

                if (response.ok) {
                    Swal.fire({ icon: 'success', title: 'ลบข้อมูลสำเร็จ', timer: 1500, showConfirmButton: false, background: '#112228', color: '#00e5ff' });
                    loadData();
                }
            } catch (error) {
                Swal.fire({ icon: 'error', title: 'ไม่สามารถลบข้อมูลได้', background: '#112228', color: '#c9d1d9' });
            }
        }
    }
</script>
</body>
</html>
